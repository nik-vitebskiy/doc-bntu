<form class="filters registry-filters" method="get" action="/{{ registry_kind }}">
  <input name="q" value="{{ q }}" placeholder="Организация или номер {{ registry_item_genitive }}">
  <select name="faculty">
    <option value="">Все факультеты</option>
    {% for faculty in faculties %}<option value="{{ faculty }}" {{ 'selected' if faculty == selected_faculty }}>{{ faculty }}</option>{% endfor %}
  </select>
  <select name="status">
    <option value="">Все статусы</option>
    {% for status in statuses %}<option value="{{ status }}" {{ 'selected' if status == selected_status }}>{{ status }}</option>{% endfor %}
  </select>
  {% if registry_kind == 'contracts' %}
    <select name="end_year">
      <option value="">Любой год окончания</option>
      {% for year in end_years %}<option value="{{ year|int }}" {{ 'selected' if selected_end_year == year|string }}>{{ year|int }}</option>{% endfor %}
    </select>
    <input type="hidden" name="urgency" value="{{ selected_urgency }}">
  {% endif %}
  <button>Фильтровать</button>
  {% if registry_kind == 'contracts' %}
    <div class="urgency-filters" aria-label="Срок окончания договора">
      {% for key, label in urgency_buckets %}<button type="submit" name="urgency_choice" value="{{ key }}" class="urgency-toggle urgency-{{ key }}{{ ' active' if selected_urgency == key }}" aria-pressed="{{ 'true' if selected_urgency == key else 'false' }}">{{ label }} <span>{{ urgency_counts.get(key, 0) }}</span></button>{% endfor %}
    </div>
  {% endif %}
</form>
