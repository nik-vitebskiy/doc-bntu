<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Первичная настройка — Кадровый заказ</title>
  <link rel="stylesheet" href="/static/style.css?v=20260921-2">
  <link rel="stylesheet" href="/static/forms.css?v=20260921-1">
</head>
<body class="login-page">
  <main class="login-card setup-card">
    <div class="brand">◈ <b>Кадровый заказ</b></div>
    <h1>Создание администратора</h1>
    <p class="muted">Это одноразовая настройка при первом запуске системы.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/setup" class="account-form">
      <label>ФИО<input name="full_name" value="{{ full_name|default('') }}" required autofocus></label>
      <label>Логин<input name="username" value="{{ username|default('') }}" autocomplete="username" required></label>
      <label>Пароль<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Повторите пароль<input name="password_repeat" type="password" minlength="8" autocomplete="new-password" required></label>
      <p class="form-hint">Не менее 8 символов.</p>
      <button class="button">Создать администратора</button>
    </form>
  </main>
</body>
</html>
