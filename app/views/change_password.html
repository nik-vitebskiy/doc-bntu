{% extends "base.html" %}
{% block content %}
<a class="back" href="/">← На главную</a>
<section class="card account-card">
  <h1>Смена пароля</h1>
  {% if forced %}<p class="notice">Перед продолжением работы задайте новый пароль.</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/change-password" class="form account-form">
    <label>Текущий пароль<input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
    <label>Новый пароль<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Повторите новый пароль<input name="password_repeat" type="password" minlength="8" autocomplete="new-password" required></label>
    <p class="form-hint">Новый пароль должен содержать не менее 8 символов.</p>
    <button class="button">Сохранить пароль</button>
  </form>
</section>
{% endblock %}
