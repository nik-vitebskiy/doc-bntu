{% extends "base.html" %}
{% block content %}
<div class="page-heading">
  <div><h1>Настройки</h1><p>Реквизиты БНТУ для формирования документов</p></div>
</div>
<section class="card settings-card">
  {% if saved %}<p class="notice">Реквизиты сохранены.</p>{% endif %}
  <form method="post" action="/settings" class="settings-form">
    <fieldset>
      <legend>Университет и подписант</legend>
      <label class="settings-wide">Полное наименование<input name="full_name" value="{{ requisites.full_name }}"></label>
      <label>Должность подписанта<input name="signer_position" value="{{ requisites.signer_position }}"></label>
      <label>ФИО подписанта<input name="signer_name" value="{{ requisites.signer_name }}"></label>
      <label>Номер доверенности<input name="power_of_attorney_number" value="{{ requisites.power_of_attorney_number }}"></label>
      <label>Дата доверенности<input name="power_of_attorney_date" type="date" value="{{ requisites.power_of_attorney_date }}"></label>
    </fieldset>
    <fieldset>
      <legend>Адрес и банковские реквизиты</legend>
      <label class="settings-wide">Юридический адрес<input name="legal_address" value="{{ requisites.legal_address }}"></label>
      <label>УНП<input name="unp" value="{{ requisites.unp }}"></label>
      <label>ОКПО<input name="okpo" value="{{ requisites.okpo }}"></label>
      <label class="settings-wide">Расчётный счёт<input name="bank_account" value="{{ requisites.bank_account }}"></label>
      <label>Банк<input name="bank_name" value="{{ requisites.bank_name }}"></label>
      <label>БИК<input name="bic" value="{{ requisites.bic }}"></label>
    </fieldset>
    <p class="form-hint">Если поле оставить пустым, в сформированном документе будет прочерк «___».</p>
    <button class="button" type="submit">Сохранить</button>
  </form>
</section>
{% endblock %}
