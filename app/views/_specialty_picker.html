<div class="specialty-picker" data-specialty-picker>
  <input type="hidden" name="specialty" value="{{ selected_specialty.code if selected_specialty else '' }}"{% if picker_form_id %} form="{{ picker_form_id }}"{% endif %}>
  <input class="specialty-search" type="search" value="{{ selected_specialty.display_label if selected_specialty else '' }}" placeholder="Код или название специальности" autocomplete="off" aria-expanded="false"{% if picker_form_id %} form="{{ picker_form_id }}"{% endif %}>
  <div class="specialty-options" hidden>
    {% for specialty in specialties %}
    <button type="button" data-specialty-option data-value="{{ specialty.code }}" data-label="{{ specialty.display_label }}" data-profile="{{ specialty.profile or '' }}" data-qualification="{{ specialty.qualification or '' }}" data-search-text="{{ specialty.code|lower }} {{ specialty.name|lower }}">
      <strong>{{ specialty.code }}</strong>{% if specialty.display_name %}<span>{{ specialty.display_name }}</span>{% endif %}
    </button>
    {% endfor %}
    <p class="specialty-empty" hidden>Ничего не найдено</p>
  </div>
  <small class="specialty-error" aria-live="polite"></small>
</div>
