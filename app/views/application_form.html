{% extends "base.html" %}{% block content %}
<a class="back" href="/organizations/{{ org.id }}">← К карточке организации</a><h1>Зарегистрировать заявку</h1><p>{{ org.name }} · заявка уже получена от организации</p>
<form class="form" method="post" action="/organizations/{{ org.id }}/applications"><label>Дата получения<input name="received_date" type="date" required></label><label>Номер заявки<input name="number"></label><label>Дата подписания<input name="signed_date" type="date"></label><div class="faculty-picker"><label class="field-label">Факультеты по специальностям</label><details class="faculty-multiselect"><summary><span class="faculty-summary">Выберите факультеты</span><span class="chevron">⌄</span></summary><div class="faculty-menu"><input class="faculty-search" type="search" placeholder="Поиск факультета"><div class="faculty-options">{% for faculty in faculties %}<label data-faculty-option><input type="checkbox" name="faculty" value="{{ faculty.name }}"><span>{{ faculty.name }}</span></label>{% endfor %}</div></div></details></div><button>Зарегистрировать заявку</button></form>
<script>document.querySelectorAll('.faculty-multiselect').forEach(p=>{const s=p.querySelector('.faculty-summary'),i=p.querySelectorAll('input[type="checkbox"]'),q=p.querySelector('.faculty-search');const r=()=>{const x=[...i].filter(a=>a.checked);s.textContent=!x.length?'Выберите факультеты':x.length===1?x[0].value:`${x[0].value} + ещё ${x.length-1}`};i.forEach(a=>a.addEventListener('change',r));q.addEventListener('input',()=>p.querySelectorAll('[data-faculty-option]').forEach(o=>o.hidden=!o.textContent.toLowerCase().includes(q.value.toLowerCase())));p.closest('form').addEventListener('submit',e=>{if(![...i].some(a=>a.checked)){e.preventDefault();p.open=true;s.textContent='Выберите хотя бы один факультет'}})})</script>
{% endblock %}
